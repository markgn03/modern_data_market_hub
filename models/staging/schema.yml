version: 2

models:
  - name: stg_market_transactions
    columns:
      - name: transaction_id
        tests:
          - unique
          - not_null
      - name: currency
        tests:
          - accepted_values:
              values: ['EUR', 'USD']

  - name: stg_currency_rates
    columns:
      - name: currency
        tests:
          - not_null